<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Bit CPU Emulator</title>
    <!-- Using Tailwind CDN for immediate attractive styling based on your package.json -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira Code', monospace; }
        .neon-border { box-shadow: 0 0 10px rgba(74, 222, 128, 0.2); border: 1px solid #4ade80; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #111827; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-950 text-green-400 min-h-screen flex flex-col p-6">
    <header class="mb-8 text-center">
        <h1 class="text-4xl font-bold tracking-widest text-green-300 drop-shadow-md">8-BIT CPU EMULATOR</h1>
        <p class="text-gray-400 mt-2 text-sm">Interactive 8-Bit CPU Emulator</p>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-8 max-w-7xl mx-auto w-full">
        <!-- Left: Code Editor -->
        <section class="flex flex-col col-span-1 lg:col-span-1">
            <div class="bg-gray-900 rounded-t-md p-2 border-b border-green-800 flex justify-between items-center">
                <span class="text-xs uppercase text-green-500 font-bold">Assembly Editor</span>
            </div>
            <textarea id="code-editor" class="flex-1 w-full bg-gray-900 text-gray-200 p-4 focus:outline-none focus:ring-1 focus:ring-green-500 resize-none neon-border rounded-b-md h-96 custom-scrollbar" spellcheck="false">
MOV A, 10
MOV B, 20
ADD A, B
HLT</textarea>
            <div class="mt-4 flex gap-4">
                <button id="btn-run" class="flex-1 bg-green-600 hover:bg-green-500 text-black font-bold py-2 px-4 rounded transition-colors">RUN</button>
                <button id="btn-step" class="flex-1 bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-2 px-4 rounded transition-colors">STEP</button>
                <button id="btn-reset" class="flex-1 bg-red-600 hover:bg-red-500 text-black font-bold py-2 px-4 rounded transition-colors">RESET</button>
            </div>
        </section>

        <!-- Right: CPU State & Memory -->
        <section class="col-span-1 lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Registers -->
            <div class="flex flex-col">
                <div class="bg-gray-900 rounded-t-md p-2 border-b border-green-800">
                    <span class="text-xs uppercase text-green-500 font-bold">Registers</span>
                </div>
                <div class="bg-gray-900 p-4 neon-border rounded-b-md flex-1 grid grid-cols-2 gap-4">
                    <div class="bg-gray-800 p-2 rounded flex justify-between"><span>A:</span> <span id="reg-a" class="text-white">0x00</span></div>
                    <div class="bg-gray-800 p-2 rounded flex justify-between"><span>B:</span> <span id="reg-b" class="text-white">0x00</span></div>
                    <div class="bg-gray-800 p-2 rounded flex justify-between"><span>C:</span> <span id="reg-c" class="text-white">0x00</span></div>
                    <div class="bg-gray-800 p-2 rounded flex justify-between"><span>D:</span> <span id="reg-d" class="text-white">0x00</span></div>
                    <div class="bg-gray-800 p-2 rounded flex justify-between"><span>PC:</span> <span id="reg-pc" class="text-yellow-400">0x0000</span></div>
                    <div class="bg-gray-800 p-2 rounded flex justify-between"><span>SP:</span> <span id="reg-sp" class="text-blue-400">0xFFFF</span></div>
                    <div class="col-span-2 bg-gray-800 p-2 rounded flex justify-between mt-2">
                        <span>Status Flags:</span>
                        <span id="reg-flags" class="text-red-400">Z=0 S=0 C=0 O=0</span>
                    </div>
                </div>
            </div>

            <!-- Memory Viewer -->
            <div class="flex flex-col">
                <div class="bg-gray-900 rounded-t-md p-2 border-b border-green-800">
                    <span class="text-xs uppercase text-green-500 font-bold">Memory (RAM)</span>
                </div>
                <div class="bg-gray-900 p-0 neon-border rounded-b-md flex-1 overflow-y-auto h-64 md:h-auto custom-scrollbar">
                    <table class="w-full text-left text-sm">
                        <thead class="sticky top-0 bg-gray-900">
                            <tr class="text-gray-500 border-b border-gray-700">
                                <th class="py-2 px-4">ADDR</th>
                                <th class="py-2 px-4">DATA</th>
                            </tr>
                        </thead>
                        <tbody id="memory-body">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    
    <!-- Notifications -->
    <div id="toast" class="fixed bottom-4 right-4 bg-red-600 text-white px-4 py-2 rounded shadow-lg hidden">
        Connection error! Is the Java backend running?
    </div>

    <script src="./app.js"></script>
</body>
</html>
